version: '3.8'

services:
  # Database Service: PostgreSQL container
  db:
    image: postgres:15-alpine
    container_name: decodeup-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: decodeup_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persist database data locally

  # Backend Service: NestJS application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: decodeup-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Use same DB credentials and container name as the host
      DATABASE_URL: "postgresql://user:password@db:5432/decodeup_db?schema=public"
      JWT_SECRET: "super-secret-key-change-me"
    depends_on:
      - db # Ensure DB starts before backend

  # Frontend Service: React application + Nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: decodeup-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend # Ensure Backend starts before frontend

volumes:
  postgres_data:
